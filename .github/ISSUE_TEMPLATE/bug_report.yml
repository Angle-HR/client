name: Bug report
description: Report something that is broken or incorrect
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in what you can.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, and Node version help us reproduce the issue.
      placeholder: |
        - OS: (e.g. macOS 15, Windows 11, Ubuntu 24.04)
        - Browser: (e.g. Chrome 120)
        - Node: (e.g. 22.x — from `node -v`)
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recordings
      description: Optional but helpful for UI issues.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, related issues, or anything else that might help.
