# Runs lint, format, typecheck, tests, and production build on every PR.
# Configure branch protection to require this workflow to pass before merge.
name: Merge gate

on:
  pull_request:
  push:
    branches:
      - production
      - staging

concurrency:
  group: merge-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    needs:
      - code-quality
      - test
    uses: ./.github/workflows/build.yml
