name: Deploy to staging

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_DEV_WEBHOOK_URL }}
        run: |
          status=$(curl --silent --output response.txt --write-out "%{http_code}" -X POST "$WEBHOOK_URL")
          echo "HTTP status: $status"
          echo "Response body:"
          cat response.txt
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
