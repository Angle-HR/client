# Optional: run both services from one Dokploy "Compose" project.
# Alternatively create two separate Dokploy "Application" services, each pointing
# at this repo with Dockerfile = Dockerfile (app) and Dockerfile.storybook.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined at build time — must be passed as a
        # build arg, not just a runtime `environment:` var (see Dockerfile).
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - '3000:3000'

  storybook:
    build:
      context: .
      dockerfile: Dockerfile.storybook
    restart: unless-stopped
    ports:
      - '8080:80'
